buildscript {
    def kotlinVersion = rootProject.ext.has("kotlinVersion")
        ? rootProject.ext.get("kotlinVersion")
        : "1.9.24"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

def getExtOrDefault(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

android {
    namespace "com.liquidglasskit"
    compileSdkVersion getExtOrDefault("compileSdkVersion", 35)

    defaultConfig {
        minSdkVersion getExtOrDefault("minSdkVersion", 24)
        targetSdkVersion getExtOrDefault("targetSdkVersion", 35)
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets.main.java.srcDirs += [
        "${project.buildDir}/generated/source/codegen/java"
    ]
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation("com.facebook.react:react-android")
}
